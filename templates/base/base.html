{% load static %}
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Boarding-House-Management-System</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
    <link rel="shortcut icon" type="image/png" href="{% static 'img/favicon.png' %}">
    <!-- Tell the browser to be responsive to screen width -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="{% static 'plugins/fontawesome-free/css/all.min.css' %}">
    <!-- Theme style -->
    <link rel="stylesheet" href="{% static 'css/adminlte.min.css' %}">
    <!-- overlayScrollbars -->
    <link rel="stylesheet" href="{% static 'plugins/overlayScrollbars/css/OverlayScrollbars.min.css' %}">
    <link rel="stylesheet" href="{% static 'tables/datatables-bs4/css/dataTables.bootstrap4.min.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style type="text/css">
        :root {
            --primary: #0f172a;
            --primary-hover: #1e293b;
            --secondary: #64748b;
            --bg-main: #f8fafc;
            --bg-sidebar: #0f172a;
            --bg-header: rgba(255, 255, 255, 0.8);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --card-bg: #ffffff;
            --card-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --card-shadow-hover: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --sidebar-active: #1e293b;
            --border-radius: 12px;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
        }

        /* Sidebar Glassmorphism & Colors */
        aside.main-sidebar {
            background-color: var(--bg-sidebar) !important;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .brand-link {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
            padding: 1.5rem 1rem !important;
        }

        nav ul li a p {
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7) !important;
        }

        .sidebar-dark-primary .nav-sidebar > .nav-item > .nav-link.active {
            background-color: var(--sidebar-active) !important;
            color: #fff !important;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            border-radius: 8px;
        }

        .nav-sidebar .nav-link:hover p, 
        .nav-sidebar .nav-link:hover i {
            color: #fff !important;
        }

        /* Header / Navbar */
        nav.main-header {
            background-color: var(--bg-header) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05) !important;
            padding: 0.75rem 0;
        }

        /* Content Area */
        .content-wrapper {
            background-color: var(--bg-main) !important;
            padding: 1.5rem;
        }

        .content-header h1 {
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--text-primary);
        }

        /* Modern Stat Cards */
        .small-box {
            background: var(--card-bg) !important;
            border-radius: var(--border-radius) !important;
            box-shadow: var(--card-shadow) !important;
            transition: all 0.3s ease;
            border: 1px solid rgba(0, 0, 0, 0.05) !important;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .small-box:hover {
            transform: translateY(-5px);
            box-shadow: var(--card-shadow-hover) !important;
        }

        .small-box .inner {
            padding: 1.5rem !important;
        }

        .small-box h3 {
            font-size: 2rem !important;
            font-weight: 700 !important;
            color: var(--text-primary) !important;
            margin-bottom: 0.25rem;
        }

        .small-box p {
            color: var(--text-secondary) !important;
            font-weight: 500 !important;
            font-size: 0.95rem !important;
        }

        .small-box .icon {
            color: rgba(37, 99, 235, 0.1) !important;
            top: 10px !important;
            right: 15px !important;
        }

        .small-box .small-box-footer {
            background: rgba(0, 0, 0, 0.02) !important;
            color: var(--primary) !important;
            font-weight: 600;
            padding: 0.75rem !important;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* Buttons */
        .btn {
            border-radius: 8px;
            font-weight: 600;
            padding: 0.6rem 1.2rem;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary) !important;
            border: none !important;
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover) !important;
            transform: translateY(-1px);
            box-shadow: 0 6px 12px rgba(37, 99, 235, 0.3);
        }

        /* DataTables Styling */
        .dataTables_wrapper {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        table.dataTable thead th {
            border-bottom: 2px solid var(--bg-main) !important;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        .table td, .table th {
            padding: 1rem 0.75rem !important;
            vertical-align: middle !important;
        }

        /* Fused Pill Action Group */
        .action-group {
            display: inline-flex;
            border-radius: 50px;
            overflow: hidden;
            border: 1.5px solid #e2e8f0;
            background: #fff;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .action-group:hover {
            border-color: #cbd5e1;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .action-group .btn {
            border-radius: 0 !important;
            border: none !important;
            padding: 0.5rem 0.9rem !important;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            background: transparent !important;
            color: var(--text-secondary);
        }

        .action-group .btn:hover {
            background-color: #f1f5f9 !important;
            color: var(--primary);
        }

        .action-group .btn-outline-danger:hover {
            color: #ef4444 !important;
            background-color: #fef2f2 !important;
        }

        .action-group .btn-outline-success:hover {
            color: #10b981 !important;
            background-color: #ecfdf5 !important;
        }

        .action-group .btn:not(:last-child) {
            border-right: 1.5px solid #e2e8f0 !important;
        }

        .action-group form {
            display: contents;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .action-group .btn {
                padding: 0.4rem 0.7rem !important;
            }
        }




    </style>
    {% block style %}

    {% endblock %}
</head>

 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
